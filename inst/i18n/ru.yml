  figure_help: "Одна строка на каждую строку сводки (колонки, отмеченные в «Группировать результаты по»). Концентрация: точки — определённые лунки группы, цвет соответствует статусу лунки; вертикальная черта — среднее, горизонтальная линия — среднее ± SD; ось логарифмическая, если концентрации различаются более чем в 20 раз. CV повторов: CV лунок группы, серо-голубой — в пределах, красный — выше предела; пунктир — предел CV (у групп у границ калибровочного диапазона предел может быть выше). Лунки: число лунок группы по статусу, цвета как в легенде."
  qc_help: "Отклонение (%) каждой лунки QC от номинальной концентрации, одна строка на уровень QC. Серая полоса — допустимое отклонение уровня; серо-голубые точки — в пределах, красные — вне пределов."

