summary:
  group_title: "Группировать по"
  group_help: "Лунки с одинаковыми значениями в отмеченных колонках образуют одну строку сводки: число лунок, среднее, SD, CV, минимум и максимум их концентраций. Строки сводки — это и повторы для оценки качества: CV каждой строки сравнивается с пределом, а разведения сравниваются внутри строк без колонки разведения. «Образцы» группирует по названию, дате и дополнительным колонкам, так что повторы и разведения образца усредняются вместе; «Образцы и разведения» оставляет разведения раздельно. Число рядом с колонкой — сколько в ней разных значений."
