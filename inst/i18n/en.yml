  stat_mean: "Mean"
  stat_sd: "SD"
  stat_cv: "CV, %"
  stat_min: "Minimum"
  stat_max: "Maximum"
  stat_range: "Calibration range"
  stat_precision: "Precision (CV)"
  stat_linearity: "Dilution linearity"
  tab_table: "Table"
  tab_infographics: "Infographics"
  dilution_help: "Each line is a sample (a row of the summary without the dilution column) measured at two or more dilutions; its colour and name are in the legend on the right. A point is the mean concentration at a dilution, corrected for the dilution, shown as its deviation (%) from the mean over all dilutions of the sample. The grey band is the allowed deviation (±{bias} %). Solid lines with circles: the dilutions agree. Dashed lines with triangles (also in the legend): a deviation outside the band or a CV between dilutions above {cv} %."
  dilution_table: "Agreement between sample dilutions"
  dilution_table_help: "Mean concentration of a sample at each dilution (corrected for the dilution) and its deviation from the mean over all dilutions of the sample. The dilutions agree if every deviation is within ±{bias} % and the CV between dilutions is at most {cv} %; values outside the limits are highlighted. Samples are the rows of the summary without the dilution column."
