summary:
  group_title: "Group results by"
  group_help: "Wells with the same values in the ticked columns form one row of the summary: the number of wells, the mean, SD, CV, minimum and maximum of their concentrations. The rows are also the replicates of the quality assessment: the CV of each row is checked against the limit and dilutions are compared within the rows without the dilution column. \"Samples\" groups by the sample name, date and additional columns, so that replicates and dilutions of a sample are averaged together; \"Samples and dilutions\" keeps the dilutions apart. The number next to a column is the number of its distinct values."
