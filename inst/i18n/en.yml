crit:
  singlets: "Accept standard levels planned as single wells"
  singlets_help: "For methods that plan some standard levels as single wells: such a level is accepted by its bias, its CV cannot be assessed. Only the plan counts: a level planned in replicate that keeps one result follows the rule below."
  replicate_loss: "Level planned in replicate with one result left"
  replicate_loss_help: "A level planned in two or more wells that keeps a single back-calculated result. Accept if the lost well was excluded with a reason: accepted by its bias (the CV cannot be assessed) only when every lost well was excluded by the user, who gives a reason; a well without an OD or left out as OD ≤ blank is not a documented loss. Do not accept: at least two back-calculated results are required, whatever the reason of the loss. A loss by the inverse of the curve always makes the level incomplete."
  replicate_loss_documented: "Accept if the lost well was excluded with a reason"
  replicate_loss_reject: "Do not accept"
  edge_levels: "Boundary calibrators"
  edge_levels_help: "Which standard levels use the limits of the boundary calibrators. Plate plan: the lowest and the highest level of the plan, whatever wells are excluded or lost; a level keeps its limits when the fit gets narrower (as ICH M10 requires). Fit: the lowest and the highest level with wells in the fit, after the exclusions; use it only when the method says so."
  edge_levels_plan: "Lowest and highest level of the plate plan"
  edge_levels_fit: "Lowest and highest level in the fit"
  title_standards: "Acceptance criteria"
  note_standards: "ICH M10 – LBA: ICH M10 (2022) requirements for ligand binding assays. Colorimetric assay: tighter limits for BCA, Griess and similar assays. Custom: editable values, starting from those of ICH M10. Boundary calibrators are the lowest and the highest standard level of the plate plan: they keep their limits, as the other levels keep theirs, when wells are excluded."
