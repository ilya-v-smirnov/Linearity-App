  to: "Round concentrations to"
  signif: "significant figures"
  round: "decimal places"
  help: "How concentrations are rounded in the results, the summary, the report and the model parameters. Rounding is applied once, to the final dilution-corrected values. Significant figures keep the same relative precision for any value: 3 gives 0.0123, 1.23, 123 and 12300. Decimal places fix the number of digits after the decimal point: 2 gives 0.01, 1.23 and 123.46; a negative number rounds to tens, hundreds, ... (-1: 123 becomes 120). OD is always shown with 4 decimal places."

