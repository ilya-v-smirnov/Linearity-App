# Test coverage with covr. The job fails if coverage drops below 80 %.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MIN_COVERAGE: 80

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Measure coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          total <- covr::percent_coverage(cov)
          by_file <- covr::tally_coverage(cov, by = "line")
          files <- aggregate(value ~ filename, by_file, function(v) round(100 * mean(v > 0), 1))
          files <- files[order(files$value), ]
          summary <- c(
            sprintf("## Test coverage: %.1f %%", total), "",
            "| File | Coverage, % |", "|---|---|",
            sprintf("| %s | %s |", files$filename, files$value)
          )
          writeLines(summary, Sys.getenv("GITHUB_STEP_SUMMARY"))
          print(cov)
          if (total < as.numeric(Sys.getenv("MIN_COVERAGE"))) {
            stop(sprintf("Coverage %.1f %% is below %s %%", total, Sys.getenv("MIN_COVERAGE")))
          }

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
